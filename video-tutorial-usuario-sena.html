<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manual de Usuario - SINDESENA Regional Caldas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&family=JetBrains+Mono:wght@400;700&display=swap');
:root{--v:#39A900;--vo:#3B6D11;--vc:#D6F0B2;--vs:#EAF5D5;--na:#FF7800;--az:#1A6FA8;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{background:#0A0A0A;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:max(0px,calc(50vh - 55vw));min-height:100vh;font-family:'Barlow',sans-serif;color:#fff;overflow-y:auto;overflow-x:hidden;}
.player{width:min(1080px,100vw,calc((100vh - 110px)*16/9));display:flex;flex-direction:column;}
.pl-header{background:#111;border-radius:14px 14px 0 0;padding:9px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1E1E1E;}
.pl-logo{background:var(--v);padding:4px 10px;border-radius:6px;font-weight:900;font-size:13px;letter-spacing:1px;}
.pl-title{font-size:13px;color:rgba(255,255,255,.45);}
.pl-badge{background:var(--az);font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:1px;}
.pl-scene{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#060F02;}
.scene-bg{position:absolute;inset:0;transition:background .5s;}
.scene-counter{position:absolute;top:14px;right:18px;font-size:12px;color:rgba(255,255,255,.25);font-weight:700;letter-spacing:2px;z-index:50;font-family:'Barlow Condensed',sans-serif;}
.scene-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;padding:22px 44px;}
.scene-fade{position:absolute;inset:0;background:#030809;z-index:80;opacity:0;pointer-events:none;transition:opacity .3s;}
.scene-fade.on{opacity:1;}
.narrator{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.92) 40%);padding:50px 26px 14px;z-index:40;}
.narrator-inner{display:flex;align-items:flex-end;gap:12px;}
.narrator-av{width:32px;height:32px;border-radius:50%;background:var(--az);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;border:2px solid #90CAF9;}
.narrator-bubble{background:rgba(255,255,255,.09);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:8px 15px;flex:1;}
.narrator-text{font-size:14px;line-height:1.55;color:rgba(255,255,255,.9);font-weight:500;min-height:20px;}
.cursor-blink{display:inline-block;width:2px;height:13px;background:var(--v);margin-left:2px;vertical-align:middle;animation:blink .75s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.pl-progress{height:5px;background:#1A1A1A;cursor:pointer;}
.prog-bg{width:100%;height:5px;background:rgba(255,255,255,.1);position:relative;}
.prog-fill{height:5px;background:linear-gradient(90deg,var(--az),#64B5F6);transition:width .25s linear;position:relative;}
.prog-fill::after{content:'';position:absolute;right:-5px;top:-3.5px;width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:0 0 6px var(--az);}
.prog-chapters{position:absolute;inset:0;pointer-events:none;}
.chap-mark{position:absolute;top:-1px;width:2px;height:7px;background:rgba(255,255,255,.22);border-radius:1px;}
.pl-controls{background:#181818;border-radius:0 0 14px 14px;padding:10px 20px 12px;display:flex;align-items:center;gap:12px;border-top:1px solid #222;}
.ctrl-btn{background:none;border:none;cursor:pointer;color:rgba(255,255,255,.6);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;}
.ctrl-btn:hover{background:rgba(255,255,255,.1);color:#fff;}
.ctrl-btn.play{background:var(--az);color:#fff;width:42px;height:42px;}
.ctrl-btn.play:hover{background:#155C8A;transform:scale(1.05);}
.ctrl-time{font-size:12px;color:rgba(255,255,255,.4);min-width:76px;font-variant-numeric:tabular-nums;}
.ctrl-title{flex:1;text-align:center;font-size:12px;color:rgba(255,255,255,.4);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ctrl-chaps{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.6);padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap;}
.ctrl-chaps:hover{background:rgba(255,255,255,.13);color:#fff;}
.chaps-overlay{position:fixed;inset:0;background:rgba(0,0,0,.84);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;}
.chaps-overlay.open{opacity:1;pointer-events:all;}
.chaps-box{background:#1B1B1B;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:28px;width:500px;max-height:80vh;overflow-y:auto;}
.chaps-box h3{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;color:#90CAF9;margin-bottom:18px;}
.chap-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;cursor:pointer;transition:background .18s;margin-bottom:4px;}
.chap-item:hover{background:rgba(26,111,168,.18);}
.chap-item.active{background:rgba(26,111,168,.28);}
.chap-n{background:#155C8A;color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;}
.chap-item.active .chap-n{background:var(--az);}
.chap-label{font-size:13px;font-weight:600;color:rgba(255,255,255,.8);}
.chap-time{font-size:12px;color:rgba(255,255,255,.3);margin-left:auto;}
.chaps-close{display:block;margin:16px auto 0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;padding:9px 30px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:600;}
/* helpers */
.sc-t{font-family:'Barlow Condensed',sans-serif;font-size:clamp(16px,2.2vw,26px);font-weight:900;color:#90CAF9;margin-bottom:10px;flex-shrink:0;}
.win{border-radius:10px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.5);width:100%;}
.win-bar{display:flex;align-items:center;gap:7px;padding:0 12px;height:30px;flex-shrink:0;}
.wd{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
.wl{font-size:11px;color:rgba(255,255,255,.45);margin-left:4px;}
.burl{flex:1;background:#13132A;border-radius:20px;padding:3px 13px;font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--v);white-space:nowrap;overflow:hidden;}
.si{background:#F4F8F0;border:1.5px solid #D0E8B0;border-radius:7px;padding:6px 11px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#3B6D11;width:100%;}
.sels{background:#F4F8F0;border:1.5px solid #D0E8B0;border-radius:7px;padding:6px 11px;font-size:11px;color:#555;width:100%;display:flex;justify-content:space-between;align-items:center;}
.ph{background:#E0E0E0;border-radius:20px;height:9px;overflow:hidden;}
.phi{height:9px;border-radius:20px;background:linear-gradient(90deg,var(--v),#8AE030);width:0%;}
.ao{background:rgba(255,120,0,.13);border:1px solid rgba(255,120,0,.35);color:rgba(255,210,120,.9);border-radius:8px;padding:9px 15px;font-size:12px;width:100%;}
.ag{background:rgba(57,169,0,.11);border:1px solid rgba(57,169,0,.3);color:rgba(180,255,120,.9);border-radius:8px;padding:9px 15px;font-size:12px;width:100%;}
.ab{background:rgba(26,111,168,.15);border:1px solid rgba(26,111,168,.35);color:rgba(150,210,255,.9);border-radius:8px;padding:9px 15px;font-size:12px;width:100%;}
/* app sidebar */
.app-frame{display:flex;border-radius:10px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.5);width:100%;background:#F0F5EB;}
.app-sb{background:#3B6D11;width:165px;flex-shrink:0;padding:10px 8px;}
.app-mi{padding:8px 10px;border-radius:6px;font-size:11px;color:rgba(255,255,255,.6);margin-bottom:3px;cursor:pointer;}
.app-mi.on{background:#39A900;color:#fff;font-weight:700;}
.app-main{flex:1;overflow:hidden;}
.app-tb{background:#fff;padding:10px 14px;border-bottom:1px solid #E8F0E0;display:flex;align-items:center;justify-content:space-between;}
.app-ct{padding:11px 13px;}
/* table */
.tbl{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;font-size:11px;}
.tbl th{background:#EAF5D5;color:#3B6D11;font-weight:700;padding:7px 9px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.5px;}
.tbl td{padding:6px 9px;border-bottom:1px solid #F0F5EB;color:#333;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:nth-child(even) td{background:#FAFDF7;}
/* badges */
.bp{background:#FFF2CC;color:#7A5A00;font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;display:inline-block;}
.be{background:#E3F2FD;color:#0d6ea8;font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;display:inline-block;}
.bt{background:#D6F0B2;color:#3B6D11;font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;display:inline-block;}
/* wizard tabs */
.wt-row{display:flex;background:#EAF5D5;border-bottom:2px solid #D0E8B0;}
.wt{flex:1;padding:9px 10px;text-align:center;font-size:11px;font-weight:600;color:#6B6B6B;border-right:1px solid #D0E8B0;}
.wt:last-child{border-right:none;}
.wt.on{background:#39A900;color:#fff;}
.wt.done{background:#D6F0B2;color:#3B6D11;}
.wt-n{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.15);font-size:10px;font-weight:900;margin-right:4px;}
.wt.on .wt-n{background:rgba(255,255,255,.3);}
.wt.done .wt-n{background:#39A900;color:#fff;}
/* form grid */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px;}
.fg.full{grid-template-columns:1fr;}
.fc h5{font-size:10px;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.ffl{grid-column:1/-1;}
/* portal */
.portal-bg{background:linear-gradient(135deg,#1B4D2E,#0D2B18);padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px;}
.portal-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:520px;}
.pc{border:2px solid;border-radius:12px;padding:16px;backdrop-filter:blur(4px);}
.pc h4{font-size:13px;font-weight:800;margin-bottom:4px;}
.pc p{font-size:10px;opacity:.6;line-height:1.4;margin-bottom:10px;}
.pc-btn{padding:7px;border-radius:7px;font-size:11px;font-weight:700;border:none;cursor:pointer;width:100%;}
/* historial */
.hist{position:relative;padding-left:20px;margin:10px 0;}
.hist::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:2px;background:#D0E8B0;border-radius:1px;}
.hi{position:relative;background:#fff;border-radius:9px;padding:10px 13px;margin-bottom:10px;box-shadow:0 1px 5px rgba(0,0,0,.05);}
.hi::before{content:'';position:absolute;left:-15px;top:10px;width:10px;height:10px;border-radius:50%;background:#39A900;border:2px solid #fff;box-shadow:0 0 0 1.5px #39A900;}
.hi h5{font-size:11px;font-weight:700;color:#2C2C2C;margin-bottom:2px;}
.hi .hm{font-size:10px;color:#888;}
.hi .hc{font-size:11px;color:#555;margin-top:4px;font-style:italic;}
/* animaciones */
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes slideup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideleft{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideright{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:translateX(0)}}
@keyframes popin{from{opacity:0;transform:scale(.78)}to{opacity:1;transform:scale(1)}}
@keyframes growbar{from{width:0%}to{width:100%}}
@keyframes typerev{from{max-width:0;overflow:hidden}to{max-width:500px;overflow:hidden}}
@keyframes ringpulse{0%{transform:translate(-50%,-50%) scale(.4);opacity:.7}100%{transform:translate(-50%,-50%) scale(2.5);opacity:0}}
@keyframes checkslide{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
@keyframes rowslide{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
@keyframes vencblink{0%,100%{opacity:1}50%{opacity:.5}}
.afi{opacity:0;animation:fadein .5s forwards;}
.asu{opacity:0;animation:slideup .5s forwards;}
.asl{opacity:0;animation:slideleft .45s forwards;}
.asr{opacity:0;animation:slideright .45s forwards;}
.api{opacity:0;animation:popin .45s cubic-bezier(.34,1.56,.64,1) forwards;}
.ach{opacity:0;animation:checkslide .4s forwards;}
.ring{position:absolute;border-radius:50%;border:2px solid rgba(26,111,168,.2);width:280px;height:280px;top:50%;left:50%;pointer-events:none;animation:ringpulse 3.2s ease-out infinite;}
</style>
</head>
<body>

<div class="chaps-overlay" id="chapsOverlay">
  <div class="chaps-box">
    <h3>Capitulos del Manual</h3>
    <div id="chapsList"></div>
    <button class="chaps-close" onclick="closeChaps()">Cerrar</button>
  </div>
</div>

<div class="player">
  <div class="pl-header">
    <div style="display:flex;align-items:center;gap:10px">
      <div class="pl-logo">SENA</div>
      <span style="color:rgba(255,255,255,.35);font-size:12px">Regional Caldas</span>
    </div>
    <div class="pl-title">SINDESENA - Sistema de Radicados</div>
    <div class="pl-badge">MANUAL USUARIO v2</div>
  </div>
  <div class="pl-scene" id="sceneWrap">
    <div class="scene-bg" id="sceneBg"></div>
    <div class="scene-counter" id="sceneCtr">01 / 13</div>
    <div class="scene-stage" id="sceneStage"></div>
    <div class="narrator">
      <div class="narrator-inner">
        <div class="narrator-av">&#9654;</div>
        <div class="narrator-bubble">
          <div class="narrator-text" id="narrText"><span class="cursor-blink"></span></div>
        </div>
      </div>
    </div>
    <div class="scene-fade" id="sceneFade"></div>
  </div>
  <div class="pl-progress" id="progBar" onclick="clickProg(event)">
    <div class="prog-bg">
      <div class="prog-fill" id="progFill" style="width:0%"></div>
      <div class="prog-chapters" id="progChaps"></div>
    </div>
  </div>
  <div class="pl-controls">
    <button class="ctrl-btn" onclick="prev()"><svg width="15" height="15" viewBox="0 0 15 15"><rect x="1" y="2" width="3" height="11" rx="1.5" fill="currentColor"/><path d="M13 2L6 7.5 13 13Z" fill="currentColor"/></svg></button>
    <button class="ctrl-btn play" id="btnPlay" onclick="togglePlay()">
      <svg id="iPlay" width="17" height="17" viewBox="0 0 17 17"><path d="M4 2.5L14 8.5 4 14.5Z" fill="#fff"/></svg>
      <svg id="iPause" width="17" height="17" viewBox="0 0 17 17" style="display:none"><rect x="3" y="2" width="4" height="13" rx="2" fill="#fff"/><rect x="10" y="2" width="4" height="13" rx="2" fill="#fff"/></svg>
    </button>
    <button class="ctrl-btn" onclick="next()"><svg width="15" height="15" viewBox="0 0 15 15"><rect x="11" y="2" width="3" height="11" rx="1.5" fill="currentColor"/><path d="M2 2L9 7.5 2 13Z" fill="currentColor"/></svg></button>
    <div class="ctrl-time" id="ctrlTime">0:00 / 0:00</div>
    <div class="ctrl-title" id="ctrlTitle">Introduccion</div>
    <button class="ctrl-chaps" onclick="openChaps()">&#9776; Capitulos</button>
  </div>
</div>

<script>
const S=[

/* 1 - INTRO */
{t:'Manual de Usuario v2.0',d:6,bg:'linear-gradient(140deg,#04101A,#061A2A 50%,#0A2A14)',
n:'Bienvenido al Manual de Usuario del sistema SINDESENA de Radicados del SENA Regional Caldas. Version 2.0 con Portal Publico para ciudadanos.',
r(el){
 el.innerHTML=`
  <div class="ring" style="animation-delay:0s"></div>
  <div class="ring" style="animation-delay:1.1s"></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:16px;z-index:2;text-align:center">
   <div class="afi" style="animation-delay:.1s;background:rgba(255,255,255,.07);border:1.5px solid rgba(26,111,168,.4);border-radius:11px;padding:10px 26px;display:inline-flex;align-items:center;gap:11px">
    <div style="background:#39A900;padding:4px 9px;border-radius:6px;font-weight:900;font-size:15px;letter-spacing:1px">SENA</div>
    <span style="color:rgba(255,255,255,.45);font-size:12px">SINDESENA Regional Caldas</span>
   </div>
   <div class="asu" style="animation-delay:.4s">
    <div style="font-family:Barlow Condensed,sans-serif;font-size:clamp(22px,4vw,50px);font-weight:900;line-height:1.05">Manual de Usuario</div>
    <div style="font-family:Barlow Condensed,sans-serif;font-size:clamp(13px,2.4vw,28px);font-weight:700;color:#A8E063;margin-top:4px">SINDESENA - Sistema de Radicados v2.0</div>
   </div>
   <div class="asu" style="animation-delay:.75s;font-size:13px;color:rgba(255,255,255,.4)">Portal Ciudadano - 4 roles - 13 modulos</div>
   <div class="asu" style="animation-delay:1s;display:flex;gap:9px;flex-wrap:wrap;justify-content:center">
    <span style="background:rgba(26,111,168,.22);border:1px solid rgba(26,111,168,.4);color:#90CAF9;padding:5px 15px;border-radius:20px;font-size:11px;font-weight:700">Ciudadano</span>
    <span style="background:rgba(57,169,0,.22);border:1px solid rgba(57,169,0,.4);color:#A8E063;padding:5px 15px;border-radius:20px;font-size:11px;font-weight:700">Instructor</span>
    <span style="background:rgba(255,193,0,.18);border:1px solid rgba(255,193,0,.35);color:#FFD060;padding:5px 15px;border-radius:20px;font-size:11px;font-weight:700">Coordinador</span>
    <span style="background:rgba(192,57,43,.2);border:1px solid rgba(192,57,43,.4);color:#FF9090;padding:5px 15px;border-radius:20px;font-size:11px;font-weight:700">Administrativo</span>
   </div>
  </div>`;
}},

/* 2 - PORTAL */
{t:'Portal Ciudadano',d:8,bg:'linear-gradient(140deg,#04101A,#061A10)',
n:'Al abrir el sistema cualquier persona ve el Portal Ciudadano. Desde aqui puede crear radicados o consultar el estado de sus solicitudes sin necesidad de cuenta ni contrasena.',
r(el){
 el.style.flexDirection='column'; el.style.gap='12px';
 el.innerHTML=`
  <div class="sc-t afi" style="animation-delay:.05s">Portal Ciudadano - Pantalla inicial del sistema</div>
  <div class="win asu" style="animation-delay:.3s;max-width:780px">
   <div class="win-bar" style="background:#252535"><div class="wd" style="background:#FF5F56"></div><div class="wd" style="background:#FEBC2E"></div><div class="wd" style="background:#28C840"></div><div class="burl">http://localhost:3000</div></div>
   <div class="portal-bg">
    <div style="text-align:center;margin-bottom:6px">
     <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px">
      <div style="background:#39A900;padding:4px 8px;border-radius:5px;font-weight:900;font-size:12px;letter-spacing:1px">SENA</div>
      <span style="color:rgba(255,255,255,.6);font-size:12px">SINDESENA Regional Caldas - Sistema de Radicados</span>
     </div>
     <div style="font-size:11px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px">Portal ciudadano</div>
     <div style="font-size:22px;font-weight:900;color:#fff;margin-bottom:6px">&#191;Que desea hacer hoy?</div>
     <div style="font-size:12px;color:rgba(255,255,255,.5);max-width:380px">Registre una solicitud ante el SENA Regional Caldas o consulte el estado de sus radicados.</div>
    </div>
    <div class="portal-row">
     <div class="pc" id="pc1" style="border-color:rgba(57,169,0,.5);background:rgba(57,169,0,.12);opacity:0">
      <div style="width:40px;height:40px;border-radius:10px;background:rgba(57,169,0,.3);display:flex;align-items:center;justify-content:center;margin-bottom:10px"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="2" y="2" width="18" height="18" rx="3" stroke="#A8E063" stroke-width="1.6"/><path d="M11 7v8M7 11h8" stroke="#A8E063" stroke-width="1.8" stroke-linecap="round"/></svg></div>
      <h4 style="color:#A8E063">Crear Radicado</h4>
      <p>Registre su solicitud, queja, reclamo o peticion. Tarda menos de 5 minutos.</p>
      <button class="pc-btn" style="background:#39A900;color:#fff">Iniciar radicacion &#8594;</button>

 users.forEach(([n,e,r,s],i)=>{setTimeout(()=>{const tb=document.getElementById('usrBody');if(tb){const tr=document.createElement('tr');tr.style.cssText='opacity:0;animation:rowslide .3s forwards';tr.innerHTML=`<td style="font-weight:700;font-size:11px">${n}</td><td style="font-size:10px;color:#888">${e}</td><td><span class="${s}" style="font-size:9px">${r}</span></td><td><span class="bt" style="font-size:9px">Activo</span></td>`;tb.appendChild(tr);}},1200+i*250);});
}}

];

/* == REPRODUCTOR == */
let cur=0,playing=false,elapsed=0,sceneEl=0,ticker=null,narrT=null;
const TOTAL=S.reduce((a,s)=>a+s.d,0);
window.addEventListener('DOMContentLoaded',()=>{buildChaps();loadScene(0);updateTime();});
function buildChaps(){
 const list=document.getElementById('chapsList'); let acc=0;
 S.forEach((s,i)=>{
  const mm=Math.floor(acc/60),ss=String(acc%60).padStart(2,'0');
  list.innerHTML+=`<div class="chap-item" id="ci${i}" onclick="jumpTo(${i})"><div class="chap-n">${i+1}</div><div class="chap-label">${s.t}</div><div class="chap-time">${mm}:${ss}</div></div>`;
  acc+=s.d;
 });
 const marks=document.getElementById('progChaps'); acc=0;
 S.forEach((s,i)=>{if(i>0){marks.innerHTML+=`<div class="chap-mark" style="left:${(acc/TOTAL)*100}%"></div>`;}acc+=s.d;});
}
function markChap(){document.querySelectorAll('.chap-item').forEach((e,i)=>e.classList.toggle('active',i===cur));}
function openChaps(){document.getElementById('chapsOverlay').classList.add('open');}
function closeChaps(){document.getElementById('chapsOverlay').classList.remove('open');}
function loadScene(idx){
 cur=idx; sceneEl=0;
 const s=S[idx],fade=document.getElementById('sceneFade');
 fade.classList.add('on');
 setTimeout(()=>{
  document.getElementById('sceneBg').style.background=s.bg;
  document.getElementById('sceneCtr').textContent=String(idx+1).padStart(2,'0')+' / '+S.length;
  document.getElementById('ctrlTitle').textContent=s.t;
  const stage=document.getElementById('sceneStage');
  stage.style.cssText='position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;padding:22px 44px;flex-direction:column;gap:0;';
  stage.innerHTML='';
  s.r(stage);
  typeNarr(s.n);
  fade.classList.remove('on');
  markChap(); updateTime();
 },320);
}
function togglePlay(){
 playing=!playing;
 document.getElementById('iPlay').style.display=playing?'none':'block';
 document.getElementById('iPause').style.display=playing?'block':'none';
 if(playing)startTicker(); else clearInterval(ticker);
}
function startTicker(){
 clearInterval(ticker);
 ticker=setInterval(()=>{
  elapsed+=.1; sceneEl+=.1; updateTime();
  if(sceneEl>=S[cur].d){
   if(cur<S.length-1){elapsed=S.slice(0,cur+1).reduce((a,s)=>a+s.d,0);loadScene(cur+1);if(playing)startTicker();}
   else{playing=false;document.getElementById('iPlay').style.display='block';document.getElementById('iPause').style.display='none';clearInterval(ticker);}
  }
 },100);
}
function next(){jumpTo(Math.min(cur+1,S.length-1));}
function prev(){jumpTo(Math.max(cur-1,0));}
function jumpTo(idx){clearInterval(ticker);elapsed=S.slice(0,idx).reduce((a,s)=>a+s.d,0);loadScene(idx);closeChaps();if(playing)startTicker();}
function clickProg(e){
 const r=document.getElementById('progBar').getBoundingClientRect();
 const pct=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
 const target=pct*TOTAL; let acc=0;
 for(let i=0;i<S.length;i++){if(acc+S[i].d>target){elapsed=target;loadScene(i);if(playing)startTicker();return;}acc+=S[i].d;}
}
function updateTime(){
 const pct=Math.min(elapsed/TOTAL*100,100);
 document.getElementById('progFill').style.width=pct+'%';
 document.getElementById('ctrlTime').textContent=fmt(elapsed)+' / '+fmt(TOTAL);
}
function fmt(s){const m=Math.floor(s/60);return m+':'+String(Math.floor(s%60)).padStart(2,'0');}
function typeNarr(text){
 clearTimeout(narrT);
 const el=document.getElementById('narrText'); el.innerHTML='<span class="cursor-blink"></span>';
 let i=0;
 function step(){if(i<=text.length){el.innerHTML=text.slice(0,i)+'<span class="cursor-blink"></span>';i++;narrT=setTimeout(step,25);}}
 step();
}
</script>
